    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // 🎵 Web Audio API 기반 효과음 관리자 (효과음 & 축하 팡파레)
    // =========================================================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      setMuted(val) { this.isMuted = val; }
      getMuted() { return this.isMuted; }

      playTone(freq, type = 'sine', duration = 0.2, gainVal = 0.2, delay = 0) {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(gainVal, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playButtonPop() {
        if (this.isMuted) return;
        this.playTone(523.25, 'triangle', 0.1, 0.18, 0); // 도
        this.playTone(659.25, 'sine', 0.12, 0.14, 0.04); // 미
      }

      playPraiseSound() {
        if (this.isMuted) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          this.playTone(freq, 'triangle', 0.25, 0.2, idx * 0.07);
          this.playTone(freq * 2, 'sine', 0.15, 0.06, idx * 0.07 + 0.02);
        });
      }

      playCelebrationFanfare() {
        if (this.isMuted) return;
        const notes = [
          { freq: 523.25, duration: 0.16, time: 0 },
          { freq: 523.25, duration: 0.16, time: 0.18 },
          { freq: 523.25, duration: 0.16, time: 0.36 },
          { freq: 659.25, duration: 0.35, time: 0.54 },
          { freq: 783.99, duration: 0.55, time: 0.9 },
          { freq: 659.25, duration: 0.16, time: 1.5 },
          { freq: 783.99, duration: 0.16, time: 1.7 },
          { freq: 1046.5, duration: 0.7, time: 1.9 },
          { freq: 880.0, duration: 0.25, time: 2.7 },
          { freq: 987.77, duration: 0.25, time: 2.98 },
          { freq: 1046.5, duration: 0.9, time: 3.25 }
        ];
        notes.forEach(n => {
          this.playTone(n.freq, 'triangle', n.duration, 0.25, n.time);
          this.playTone(n.freq * 1.5, 'sine', n.duration * 0.7, 0.08, n.time);
        });
      }

      playResetSound() {
        if (this.isMuted) return;
        [1046.5, 783.99, 659.25, 523.25].forEach((freq, idx) => {
          this.playTone(freq, 'sine', 0.25, 0.15, idx * 0.08);
        });
      }
    }

    // =========================================================================
    // ✨ 캔버스 폭죽 & 별가루 파티클 엔진
    // =========================================================================
    class ParticleEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.animId = null;
        this.isActive = false;
        this.resize = this.resize.bind(this);
        window.addEventListener('resize', this.resize);
        this.resize();
      }
      resize() {
        if (this.canvas) {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
        }
      }
      burstStars(x = window.innerWidth / 2, y = window.innerHeight / 2, count = 25) {
        const colors = ['#f59e0b', '#fbbf24', '#10b981', '#34d399', '#38bdf8', '#ec4899', '#f43f5e'];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
          const speed = Math.random() * 7 + 3.5;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            gravity: 0.16,
            friction: 0.96,
            size: Math.random() * 12 + 8,
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 14,
            color: colors[Math.floor(Math.random() * colors.length)],
            type: Math.random() > 0.4 ? 'star' : 'sparkle',
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015
          });
        }
        if (!this.isActive) this.start();
      }
      burstCelebration(duration = 5000) {
        const colors = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#fbbf24'];
        const types = ['ribbon', 'star', 'leaf', 'circle'];
        const startTime = Date.now();
        const interval = setInterval(() => {
          if (Date.now() - startTime > duration) {
            clearInterval(interval);
            return;
          }
          for (let i = 0; i < 6; i++) {
            const fromLeft = Math.random() > 0.5;
            this.particles.push({
              x: fromLeft ? 0 : this.canvas.width,
              y: Math.random() * (this.canvas.height * 0.6) + this.canvas.height * 0.1,
              vx: (fromLeft ? 1 : -1) * (Math.random() * 10 + 5),
              vy: -(Math.random() * 9 + 4),
              gravity: 0.2,
              friction: 0.98,
              size: Math.random() * 12 + 7,
              rotation: Math.random() * 360,
              rotSpeed: (Math.random() - 0.5) * 18,
              color: colors[Math.floor(Math.random() * colors.length)],
              type: types[Math.floor(Math.random() * types.length)],
              alpha: 1,
              decay: 0.005 + Math.random() * 0.005
            });
          }
        }, 70);
        if (!this.isActive) this.start();
      }
      start() {
        this.isActive = true;
        const loop = () => {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.vx *= p.friction;
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotSpeed;
            p.alpha -= p.decay;

            if (p.alpha <= 0 || p.y > this.canvas.height + 50) {
              this.particles.splice(i, 1);
              continue;
            }

            this.ctx.save();
            this.ctx.globalAlpha = Math.max(0, p.alpha);
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate((p.rotation * Math.PI) / 180);
            this.ctx.fillStyle = p.color;

            if (p.type === 'star') {
              this.drawStar(this.ctx, 0, 0, 5, p.size, p.size / 2);
            } else if (p.type === 'leaf') {
              this.drawLeaf(this.ctx, 0, 0, p.size);
            } else if (p.type === 'ribbon') {
              this.ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            } else {
              this.ctx.beginPath();
              this.ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
              this.ctx.fill();
            }
            this.ctx.restore();
          }

          if (this.particles.length > 0) {
            this.animId = requestAnimationFrame(loop);
          } else {
            this.isActive = false;
          }
        };
        loop();
      }
      drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = (Math.PI / 2) * 3;
        let x = cx;
        let y = cy;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          ctx.lineTo(x, y);
          rot += step;
          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
      }
      drawLeaf(ctx, cx, cy, size) {
        ctx.beginPath();
        ctx.moveTo(cx, cy - size / 2);
        ctx.bezierCurveTo(cx + size / 2, cy - size / 4, cx + size / 2, cy + size / 4, cx, cy + size / 2);
        ctx.bezierCurveTo(cx - size / 2, cy + size / 4, cx - size / 2, cy - size / 4, cx, cy - size / 2);
        ctx.closePath();
        ctx.fill();
      }
      destroy() {
        window.removeEventListener('resize', this.resize);
        if (this.animId) cancelAnimationFrame(this.animId);
      }
    }

      '🧣 손수건을 썼어요', '🔌 안 쓰는 플러그를 뽑았어요', '🥛 우유팩을 잘 펼쳤어요'
    ];

    const STORAGE_KEY = 'earth_guardian_classroom_data_v1';

    // =========================================================================
    // 1. 헤더 컴포넌트 (모바일/태블릿 반응형 네비게이션)
    // =========================================================================
    function Header({ classNameTitle, onUpdateTitle, completedTreesCount, isMuted, onToggleMute, onResetAll, activeTab, onSelectTab, historyCount }) {
      const [isEditing, setIsEditing] = useState(false);
      const [editValue, setEditValue] = useState(classNameTitle);
      const [isFullscreen, setIsFullscreen] = useState(false);

      const handleSave = () => {
        if (editValue.trim()) onUpdateTitle(editValue.trim());
        setIsEditing(false);
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          setIsFullscreen(true);
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          setIsFullscreen(false);
        }
      };

      return (
        <header className="w-full bg-white/95 backdrop-blur-md border-b-2 sm:border-b-4 border-emerald-300 shadow-sm px-2.5 sm:px-4 py-2 flex flex-col sm:flex-row sm:items-center justify-between gap-2 z-20 flex-shrink-0">
          {/* 상단 1열: 로고 & 타이틀 & 액션 버튼들 */}
          <div className="flex items-center justify-between gap-2 w-full sm:w-auto">
            <div className="flex items-center gap-2 min-w-0">
              <div className="w-9 h-9 sm:w-11 sm:h-11 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-xl sm:rounded-2xl flex items-center justify-center shadow-md text-xl sm:text-2xl border-2 border-white flex-shrink-0">
                🌍
              </div>
              {isEditing ? (
                <div className="flex items-center gap-1.5 flex-1 min-w-0">
                  <input
                    type="text"
                    value={editValue}
                    onChange={(e) => setEditValue(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSave()}
                    className="px-2.5 py-1 text-base sm:text-lg font-bold bg-emerald-50 border-2 border-emerald-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400 max-w-[160px] sm:max-w-xs"
                    maxLength={20}
                    autoFocus
                  />
                  <button onClick={handleSave} className="p-1.5 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 active:scale-95 shadow">
                    <IconCheck size={16} />
                  </button>
                </div>
              ) : (
                <div className="flex items-center gap-1 min-w-0 group">
                  <h1 className="text-lg sm:text-2xl md:text-3xl font-black text-emerald-900 tracking-tight flex items-center gap-1 font-jua truncate">
                    <span>{classNameTitle}</span>
                    <span className="text-emerald-600 text-sm sm:text-xl font-normal hidden xs:inline">🌱 나무 키우기</span>
                  </h1>
                  <button onClick={() => { setEditValue(classNameTitle); setIsEditing(true); }} className="opacity-50 hover:opacity-100 p-1 text-slate-500 hover:text-emerald-700 transition" title="학급 이름 변경">
                    <IconPen size={14} />
                  </button>
                </div>
              )}
            </div>

            {/* 모바일 화면용 컴팩트 컨트롤 버튼 */}
            <div className="flex sm:hidden items-center gap-1">
              <button
                onClick={() => { onToggleMute(); sound.playButtonPop(); }}
                className={`p-1.5 rounded-xl border transition-all active:scale-95 flex items-center justify-center ${isMuted ? 'bg-slate-100 border-slate-300 text-slate-400' : 'bg-emerald-100 border-emerald-300 text-emerald-700'}`}
                title={isMuted ? '소리 켜기' : '소리 끄기'}
              >
                {isMuted ? <IconVolumeX size={18} /> : <IconVolume size={18} />}
              </button>
              <button
                onClick={() => {
                  if (window.confirm('정말 처음부터 다시 시작할까요? (현재 점수와 실천 기록이 초기화됩니다)')) {
                    onResetAll();
                    sound.playResetSound();
                  }
                }}
                className="p-1.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl transition-all active:scale-95"
                title="처음부터 다시 시작"
              >
                <IconReset size={18} />
              </button>
            </div>
          </div>

          {/* 상단 2열 / 데스크톱 우측: 키운 숲 카운터 & 제어 버튼 & 탭 */}
          <div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto">
            {/* 키운 숲 카운터 */}
            <div className="flex items-center gap-2 bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-200 text-amber-950 border-2 border-amber-400 px-3 py-1 sm:px-4 sm:py-1.5 rounded-xl sm:rounded-2xl shadow-sm font-jua flex-shrink-0">
              <span className="text-base sm:text-xl">🌲</span>
              <div className="flex items-baseline gap-1">
                <span className="text-[11px] sm:text-xs md:text-sm font-bold text-amber-800 hidden xs:inline">키운 숲:</span>
                <span className="text-base sm:text-xl md:text-2xl font-black text-emerald-800">총 {completedTreesCount}그루!</span>
              </div>
            </div>

            {/* 모바일/태블릿 화면용 탭 전환 버튼 (대형 화면에서는 숨김) */}
            <div className="flex lg:hidden items-center bg-emerald-100/90 p-1 rounded-xl border border-emerald-300 gap-1 flex-1 max-w-[200px] sm:max-w-xs justify-center">
              <button
                onClick={() => onSelectTab('tree')}
                className={`flex-1 py-1 px-2 rounded-lg text-xs sm:text-sm font-bold font-jua transition-all text-center ${activeTab === 'tree' ? 'bg-emerald-600 text-white shadow-sm' : 'text-emerald-800 hover:bg-emerald-200/60'}`}
              >
                🌱 나무 보기
              </button>
              <button
                onClick={() => onSelectTab('history')}
                className={`flex-1 py-1 px-2 rounded-lg text-xs sm:text-sm font-bold font-jua transition-all text-center flex items-center justify-center gap-1 ${activeTab === 'history' ? 'bg-emerald-600 text-white shadow-sm' : 'text-emerald-800 hover:bg-emerald-200/60'}`}
              >
                <span>📖 기록</span>
                <span className={`text-[10px] px-1.5 py-0.2 rounded-full ${activeTab === 'history' ? 'bg-white text-emerald-800' : 'bg-emerald-200 text-emerald-900'}`}>{historyCount}</span>
              </button>
            </div>

            {/* 데스크톱/태블릿용 도구 버튼들 */}
            <div className="hidden sm:flex items-center gap-1.5 md:gap-2">
              <button
                onClick={() => { onToggleMute(); sound.playButtonPop(); }}
                className={`p-2 rounded-xl sm:rounded-2xl border-2 transition-all active:scale-95 flex items-center justify-center ${isMuted ? 'bg-slate-100 border-slate-300 text-slate-400' : 'bg-emerald-100 border-emerald-300 text-emerald-700 hover:bg-emerald-200 shadow-sm'}`}
                title={isMuted ? '소리 켜기' : '소리 끄기'}
              >
                {isMuted ? <IconVolumeX size={18} /> : <IconVolume size={18} />}
              </button>
              <button
                onClick={() => { toggleFullscreen(); sound.playButtonPop(); }}
                className="p-2 bg-sky-100 hover:bg-sky-200 border-2 border-sky-300 text-sky-700 rounded-xl sm:rounded-2xl transition-all active:scale-95 shadow-sm flex items-center justify-center"
                title={isFullscreen ? '전체화면 종료' : '전자칠판 전체화면'}
              >
                {isFullscreen ? <IconMinimize size={18} /> : <IconMaximize size={18} />}
              </button>
              <button
                onClick={() => {
                  if (window.confirm('정말 처음부터 다시 시작할까요? (현재 점수와 실천 기록이 초기화됩니다)')) {
                    onResetAll();
                    sound.playResetSound();
                  }
                }}
                className="p-2 bg-rose-50 hover:bg-rose-100 border-2 border-rose-200 text-rose-600 rounded-xl sm:rounded-2xl transition-all active:scale-95 shadow-sm flex items-center justify-center"
                title="처음부터 다시 시작"
              >
                <IconReset size={18} />
              </button>
            </div>
          </div>
        </header>
      );
    }

    // =========================================================================
    // 2. 점수 및 단계 프로그레스 바 컴포넌트
    // =========================================================================
    function ScoreBar({ score, maxScore = 20, stage }) {
      const percentage = Math.min(100, Math.max(0, (score / maxScore) * 100));

      const stageInfo = [
        { num: 1, label: '아기 새싹', range: '0~5점', icon: '🌱', active: score >= 0 && score <= 5 },
        { num: 2, label: '어린 나무', range: '6~10점', icon: '🌿', active: score >= 6 && score <= 10 },
        { num: 3, label: '큰 나무', range: '11~19점', icon: '🌳', active: score >= 11 && score <= 19 },
        { num: 4, label: '열매 나무', range: '20점 달성!', icon: '🍎', active: score >= 20 }
      ];

      return (
        <div className="w-full bg-white/95 backdrop-blur-sm rounded-xl sm:rounded-2xl p-2.5 sm:px-4 sm:py-3 shadow-md border-2 sm:border-3 border-emerald-200 flex-shrink-0">
          {/* 1행: 현재 점수 & 단계 뱃지 */}
          <div className="flex items-center justify-between gap-2 mb-1.5 sm:mb-2">
            <div className="flex items-center gap-1.5 sm:gap-2.5">
              <span className="text-xl sm:text-2xl animate-bounce-gentle">🌟</span>
              <div className="flex items-baseline gap-1 sm:gap-2">
                <span className="text-xl sm:text-2xl md:text-3xl font-black text-emerald-800 font-jua tracking-tight">
                  현재 {score}점
                </span>
                <span className="text-sm sm:text-lg md:text-xl font-bold text-slate-400 font-jua">
                  / 목표 {maxScore}점
                </span>
              </div>
            </div>

            <div className="flex items-center gap-1 sm:gap-1.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-2.5 py-0.5 sm:px-4 sm:py-1 rounded-xl shadow-sm font-jua text-xs sm:text-base md:text-lg">
              <IconSparkles size={15} className="animate-spin" style={{ animationDuration: '4s' }} />
              <span>
                {stage === 1 && '1단계: 아기 새싹 🌱'}
                {stage === 2 && '2단계: 어린 나무 🌿'}
                {stage === 3 && '3단계: 큰 나무 🌳'}
                {stage === 4 && '4단계: 열매 나무! 🍎'}
              </span>
            </div>
          </div>

          {/* 2행: 프로그레스 바 */}
          <div className="relative w-full h-6 sm:h-8 md:h-9 bg-emerald-100/90 rounded-full p-0.5 sm:p-1 shadow-inner border-2 border-emerald-300">
            <div
              className="h-full rounded-full bg-gradient-to-r from-emerald-400 via-teal-400 to-amber-400 shadow-sm transition-all duration-500 ease-out animate-shimmer relative"
              style={{ width: `${Math.max(percentage, 4)}%` }}
            >
              <div className="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-7 h-7 sm:w-8 sm:h-8 md:w-9 md:h-9 bg-white rounded-full border-2 border-amber-400 shadow-md flex items-center justify-center text-sm sm:text-base md:text-xl animate-pulse">
                {score >= 20 ? '👑' : '⭐'}
              </div>
            </div>
          </div>

          {/* 3행: 4단계 안내 카드 (모바일 2x2, 태블릿/PC 4x1) */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-1 sm:gap-1.5 mt-1.5 sm:mt-2 pt-1 sm:pt-1.5 border-t border-emerald-100">
            {stageInfo.map((item) => (
              <div
                key={item.num}
                className={`flex items-center justify-center gap-1 py-0.5 sm:py-1 px-1 sm:px-1.5 rounded-lg transition-all ${
                  item.active
                    ? 'bg-emerald-100 text-emerald-950 font-black border-2 border-emerald-400 shadow-xs scale-102'
                    : 'bg-white/60 text-slate-400 opacity-70'
                }`}
              >
                <span className="text-sm sm:text-base md:text-lg">{item.icon}</span>
                <span className="text-[11px] sm:text-xs md:text-sm font-jua truncate">
                  {item.num}단계 ({item.range})
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. 나무 일러스트 및 배경 애니메이션 컴포넌트
    // =========================================================================
    function TreeIllustration({ stage, score }) {
      return (
        <div className="relative w-full h-full flex items-center justify-center select-none pointer-events-none overflow-hidden min-h-[220px] sm:min-h-[300px] md:min-h-[380px]">
          {/* 배경 하늘 요소 (태양, 구름, 무지개, 나비) */}
          <div className="absolute inset-0 overflow-hidden pointer-events-none">
            {/* 회전하는 밝은 태양 */}
            <div className="absolute top-2 left-3 sm:top-4 sm:left-8 flex items-center gap-2 animate-bounce-gentle">
              <div
                className="w-12 h-12 sm:w-18 sm:h-18 md:w-24 md:h-24 bg-gradient-to-tr from-amber-400 via-yellow-300 to-amber-200 rounded-full shadow-[0_0_25px_rgba(251,191,36,0.5)] border-2 sm:border-4 border-amber-200 flex items-center justify-center text-2xl sm:text-4xl md:text-5xl animate-spin"
                style={{ animationDuration: '28s' }}
              >
                ☀️
              </div>
            </div>

            {/* 둥둥 떠다니는 구름 */}
            <div className="absolute top-2 right-4 sm:top-5 sm:right-16 md:right-24 animate-float opacity-85" style={{ animationDuration: '8s' }}>
              <div className="flex items-center text-4xl sm:text-6xl md:text-7xl text-sky-200 drop-shadow-md">
                ☁️
              </div>
            </div>

            {/* 3단계 & 4단계: 무지개 등장 */}
            {(stage === 3 || stage === 4) && (
              <div className="absolute top-1 left-1/2 -translate-x-1/2 opacity-75 animate-pulse-subtle pointer-events-none scale-75 sm:scale-100">
                <svg width="340" height="140" viewBox="0 0 200 85" fill="none">
                  <path d="M 10,85 A 90,90 0 0,1 190,85" stroke="#f87171" strokeWidth="6" opacity="0.7" />
                  <path d="M 20,85 A 80,80 0 0,1 180,85" stroke="#fbbf24" strokeWidth="6" opacity="0.7" />
                  <path d="M 30,85 A 70,70 0 0,1 170,85" stroke="#34d399" strokeWidth="6" opacity="0.7" />
                  <path d="M 40,85 A 60,60 0 0,1 160,85" stroke="#60a5fa" strokeWidth="6" opacity="0.7" />
                  <path d="M 50,85 A 50,50 0 0,1 150,85" stroke="#a78bfa" strokeWidth="6" opacity="0.7" />
                </svg>
              </div>
            )}

            {/* 날아다니는 나비 & 꿀벌 */}
            <div className="absolute bottom-12 left-4 sm:bottom-20 sm:left-12 text-2xl sm:text-4xl animate-bounce-gentle" style={{ animationDuration: '3s' }}>
              🦋
            </div>
            {stage >= 2 && (
              <div className="absolute top-16 right-8 sm:top-20 sm:right-20 text-xl sm:text-3xl animate-float" style={{ animationDuration: '4.5s' }}>
                🐝
              </div>
            )}
          </div>

          {/* 메인 나무 일러스트 (단계별 고화질 이미지) */}
          <div className="relative w-full max-w-[650px] h-full flex flex-col items-center justify-end pb-2 px-2 overflow-visible">
            
            {/* 1단계: 아기 새싹 */}
            <img 
              src="./seedling.jpg" 
              alt="1단계 아기 새싹" 
              style={{ mixBlendMode: 'multiply' }}
              className={`absolute top-[40%] bottom-10 sm:bottom-14 left-0 right-0 mx-auto w-full object-contain mix-blend-multiply transition-all duration-1000 ease-in-out origin-bottom drop-shadow-xl ${stage === 1 ? 'opacity-100 scale-100 delay-300' : 'opacity-0 scale-90 pointer-events-none'}`} 
            />
            {stage === 1 && (
              <div className="absolute bottom-2 z-20 bg-amber-100/95 border-2 border-amber-400 text-amber-950 px-3 py-1 sm:px-5 sm:py-1.5 rounded-full font-black font-jua text-xs sm:text-base md:text-lg shadow-sm text-center animate-pop-in">
                흙 속에서 파릇파릇 아기 새싹이 돋아났어요! 🌱
              </div>
            )}

            {/* 2단계: 어린 나무 */}
            <img 
              src="./sapling.jpg" 
              alt="2단계 어린 나무" 
              style={{ mixBlendMode: 'multiply' }}
              className={`absolute top-[25%] bottom-10 sm:bottom-14 left-0 right-0 mx-auto w-full object-contain mix-blend-multiply transition-all duration-1000 ease-in-out origin-bottom drop-shadow-xl ${stage === 2 ? 'opacity-100 scale-100 delay-300' : 'opacity-0 scale-90 pointer-events-none'}`} 
            />
            {stage === 2 && (
              <div className="absolute bottom-2 z-20 bg-emerald-100/95 border-2 border-emerald-400 text-emerald-950 px-3 py-1 sm:px-5 sm:py-1.5 rounded-full font-black font-jua text-xs sm:text-base md:text-lg shadow-sm text-center animate-pop-in">
                줄기가 굵어지고 싱그러운 잎이 쑥쑥 자라요! 🌿
              </div>
            )}

            {/* 3단계: 큰 나무 */}
            <img 
              src="./tree.jpg" 
              alt="3단계 큰 나무" 
              style={{ mixBlendMode: 'multiply' }}
              className={`absolute top-[10%] bottom-10 sm:bottom-14 left-0 right-0 mx-auto w-full object-contain mix-blend-multiply transition-all duration-1000 ease-in-out origin-bottom drop-shadow-2xl ${stage === 3 ? 'opacity-100 scale-100 delay-300' : 'opacity-0 scale-90 pointer-events-none'}`} 
            />
            {stage === 3 && (
              <div className="absolute bottom-2 z-20 bg-teal-100/95 border-2 border-teal-400 text-teal-950 px-3 py-1 sm:px-5 sm:py-1.5 rounded-full font-black font-jua text-xs sm:text-base md:text-lg shadow-sm text-center animate-pop-in">
                우와! 잎이 무성한 멋진 큰 나무가 되었어요! 🌳
              </div>
            )}

            {/* 4단계: 열매 가득 완성된 나무 (만점!) */}
            <img 
              src="./apple_tree.jpg" 
              alt="4단계 열매 나무" 
              style={{ mixBlendMode: 'multiply' }}
              className={`absolute top-2 bottom-10 sm:bottom-14 left-0 right-0 mx-auto w-full object-contain mix-blend-multiply transition-all duration-1000 ease-in-out origin-bottom drop-shadow-2xl ${stage === 4 ? 'opacity-100 scale-100 delay-300' : 'opacity-0 scale-90 pointer-events-none'}`} 
            />
            {stage === 4 && (
              <div className="absolute bottom-2 z-20 bg-gradient-to-r from-amber-200 via-yellow-200 to-amber-200 border-2 sm:border-3 border-amber-400 text-amber-950 px-4 py-1 sm:px-6 sm:py-1.5 rounded-full font-black font-jua text-xs sm:text-base md:text-xl shadow-lg animate-pulse text-center">

              </div>
            )}
          </div>
        </div>
      );

    // =========================================================================
    // 4. 실천 버튼 그리드 컴포넌트 (모바일 2열/3열, 태블릿/PC 3열 반응형)
    // =========================================================================
    function ActionButtonsGrid({ onActionClick, onCustomClick, isMaxScore }) {
      const handleClick = (item, e) => {
        sound.playButtonPop();
        if (item.id === 'custom') {
          onCustomClick();
        } else {
          onActionClick(item, e);
        }
      };

      return (
        <div className="w-full bg-white/95 backdrop-blur-md rounded-xl sm:rounded-2xl p-2 sm:p-2.5 shadow-md border-2 sm:border-3 border-emerald-200 flex-shrink-0">
          <div className="flex items-center justify-between mb-1 sm:mb-1.5 px-1">
            <h2 className="text-xs sm:text-sm md:text-base font-black text-emerald-800 flex items-center gap-1 font-jua">
              <span className="text-base sm:text-lg">👆</span>
              <span>내가 한 환경 보호 실천을 눌러주세요:</span>
            </h2>
            <span className="text-[10px] sm:text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full font-gowun">

            </span>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-1 sm:gap-1.5 md:gap-2">
            {ACTION_ITEMS.map((item) => (
              <button
                key={item.id}
                onClick={(e) => handleClick(item, e)}
                disabled={isMaxScore}
                className={`
                  kiosk-btn group relative overflow-hidden rounded-lg sm:rounded-xl md:rounded-2xl py-1.5 px-2 sm:py-2 sm:px-2.5 md:py-2 md:px-3
                  bg-gradient-to-br ${item.bg} border-2 ${item.border} ${item.text}
                  flex items-center gap-1.5 sm:gap-2 text-left
                  transition-all duration-100 cursor-pointer select-none
                  ${item.isSpecial ? 'ring-2 ring-purple-300 font-black' : ''}
                  ${isMaxScore ? 'opacity-50 cursor-not-allowed' : 'active:scale-95'}
                `}
              >
                <span className="text-lg sm:text-xl md:text-2xl filter drop-shadow-sm flex-shrink-0 group-hover:scale-110 transition-transform duration-150">
                  {item.icon}
                </span>
                <div className="flex-1 min-w-0">
                  <span className="text-[11px] sm:text-xs md:text-sm lg:text-base font-black font-jua leading-tight block truncate drop-shadow-sm">
                    {item.title}
                  </span>
                </div>
                <div className="w-4 h-4 sm:w-5 sm:h-5 md:w-6 md:h-6 rounded-full bg-white/80 flex items-center justify-center text-[9px] sm:text-[10px] md:text-xs font-black shadow-xs flex-shrink-0 text-emerald-900 group-hover:bg-white">
                  +1
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 5. 우리 반 실천 기록장 컴포넌트
    // =========================================================================
    function HistoryPanel({ history = [] }) {
      return (
        <div className="h-full flex flex-col bg-white/95 backdrop-blur-md rounded-2xl sm:rounded-3xl p-3 sm:p-4 shadow-lg border-2 sm:border-4 border-emerald-200 overflow-hidden">
          <div className="flex items-center justify-between pb-2 sm:pb-3 border-b-2 border-emerald-100 flex-shrink-0">
            <div className="flex items-center gap-1.5 sm:gap-2">
              <div className="w-8 h-8 sm:w-9 sm:h-9 bg-emerald-100 rounded-xl flex items-center justify-center text-emerald-700 text-base sm:text-lg">
                📖
              </div>
              <div>
                <h3 className="text-base sm:text-lg md:text-xl font-black text-emerald-900 font-jua">
                  우리 반 실천 기록장
                </h3>
                <span className="text-[10px] sm:text-xs text-emerald-600 font-gowun">
                  오늘 모은 소중한 실천들
                </span>
              </div>
            </div>
            <span className="bg-emerald-500 text-white font-jua px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-xs sm:text-sm shadow-sm flex items-center gap-1">
              <IconHeart size={12} className="fill-white" />
              <span>{history.length}회</span>
            </span>
          </div>

          <div className="flex-1 overflow-y-auto mt-2 sm:mt-3 pr-1 space-y-1.5 sm:space-y-2">
            {history.length === 0 ? (
              <div className="h-full min-h-[140px] flex flex-col items-center justify-center text-center p-4 text-slate-400">
                <span className="text-3xl mb-1 sm:mb-2 animate-bounce-gentle">🌱</span>
                <p className="font-jua text-sm sm:text-base text-slate-500">
                  아직 실천 기록이 없어요!
                </p>
                <p className="text-[11px] sm:text-xs text-slate-400 font-gowun mt-0.5">
                  실천 버튼을 눌러 우리 반 첫 실천을 기록해 보세요!
                </p>
              </div>
            ) : (
              history.map((item) => (
                <div
                  key={item.id}
                  className={`
                    p-2 sm:p-2.5 rounded-xl sm:rounded-2xl border transition-all animate-pop-in
                    ${item.isCustom ? 'bg-gradient-to-r from-purple-50 to-pink-50 border-purple-300 shadow-sm' : 'bg-emerald-50/70 border-emerald-200 hover:bg-emerald-100/50'}
                  `}
                >
                  <div className="flex items-start gap-2">
                    <span className="text-xl sm:text-2xl flex-shrink-0 p-0.5 sm:p-1 bg-white rounded-lg sm:rounded-xl shadow-xs border border-slate-100">
                      {item.icon}
                    </span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center justify-between gap-1">
                        <span className="font-jua text-xs sm:text-sm md:text-base text-slate-800 break-words leading-snug">
                          {item.title}
                        </span>
                        {item.isCustom && (
                          <span className="flex-shrink-0 text-[9px] sm:text-[10px] bg-purple-200 text-purple-800 font-bold px-1.5 py-0.2 rounded-full font-gowun">
                            나만의 실천 ✨
                          </span>
                        )}
                      </div>
                      <div className="flex items-center gap-1 mt-0.5 text-[10px] sm:text-[11px] text-emerald-700 font-gowun font-bold">
                        <IconClock size={10} />
                        <span>{item.time}</span>
                        <span>•</span>
                        <span className="text-amber-600">참 잘했어요! ⭐</span>
                      </div>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>

          <div className="mt-2 pt-1.5 sm:pt-2 border-t border-emerald-100 text-center flex-shrink-0">
            <p className="text-[11px] sm:text-xs text-emerald-700 font-gowun font-bold flex items-center justify-center gap-1">
              <span>작은 실천이 모여 큰 숲을 만들어요! 🌳</span>
            </p>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 6. 나만의 실천 입력 모달
    // =========================================================================
    function CustomModal({ isOpen, onClose, onSubmit }) {
      const [customText, setCustomText] = useState('');
      if (!isOpen) return null;

      const handleConfirm = (textToUse) => {
        const finalText = (textToUse !== undefined ? textToUse : customText).trim() || '스스로 실천한 소중한 환경 보호';
        onSubmit(finalText);
        setCustomText('');
      };

      const handlePickSuggestion = (text) => {
        sound.playButtonPop();
        setCustomText(text);
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 animate-pop-in">
          <div className="w-full max-w-lg max-h-[90dvh] overflow-y-auto bg-white rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl border-4 border-purple-300 relative">
            <button
              onClick={() => { sound.playButtonPop(); onClose(); }}
              className="absolute top-3 right-3 p-1.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 transition"
            >
              <IconClose size={20} />
            </button>

            <div className="text-center mb-3 sm:mb-5">
              <div className="inline-flex items-center justify-center w-12 h-12 sm:w-16 sm:h-16 bg-gradient-to-tr from-purple-500 to-pink-400 text-white rounded-2xl sm:rounded-3xl shadow-lg text-2xl sm:text-3xl mb-2 animate-bounce-gentle">
                ✨
              </div>
              <h3 className="text-xl sm:text-2xl md:text-3xl font-black text-purple-900 font-jua">
                어떤 환경 보호를 실천했나요?
              </h3>
              <p className="text-xs sm:text-sm md:text-base text-purple-700 font-gowun mt-0.5 font-bold">
                내가 한 멋진 행동을 적어보세요!
              </p>
            </div>

            <div className="mb-3 sm:mb-4">
              <input
                type="text"
                value={customText}
                onChange={(e) => setCustomText(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleConfirm()}
                placeholder="예) 종이를 아껴 썼어요"
                className="w-full text-base sm:text-xl font-bold font-jua px-3 py-2.5 sm:px-4 sm:py-3 bg-purple-50/70 border-2 sm:border-3 border-purple-300 rounded-xl sm:rounded-2xl focus:outline-none focus:ring-4 focus:ring-purple-200 text-purple-950 text-center shadow-inner"
                maxLength={30}
                autoFocus
              />
            </div>

            <div className="mb-4 sm:mb-6">
              <span className="text-[11px] sm:text-xs font-bold text-slate-500 block mb-1.5 font-gowun">
                💡 톡 눌러서 바로 고를 수도 있어요:
              </span>
              <div className="flex flex-wrap gap-1.5">
                {CUSTOM_SUGGESTIONS.map((sug, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => handlePickSuggestion(sug)}
                    className="text-xs sm:text-sm font-jua bg-slate-100 hover:bg-purple-100 hover:text-purple-900 text-slate-700 border border-slate-200 hover:border-purple-300 px-2.5 py-1 rounded-lg sm:rounded-xl transition active:scale-95"
                  >
                    {sug}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex gap-2 sm:gap-3">
              <button
                type="button"
                onClick={() => { sound.playButtonPop(); onClose(); }}
                className="flex-1 py-2.5 sm:py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-jua text-base sm:text-lg rounded-xl sm:rounded-2xl transition active:scale-95"
              >
                취소
              </button>
              <button
                type="button"
                onClick={() => handleConfirm()}
                className="flex-[2] py-2.5 sm:py-3.5 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-jua text-base sm:text-xl rounded-xl sm:rounded-2xl shadow-lg border-2 border-white transition active:scale-95 flex items-center justify-center gap-1.5 animate-shimmer"
              >
                <IconCheck size={20} />
                <span>실천 완료! (+1점)</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 7. 참 잘했어요 칭찬 토스트
    // =========================================================================
    function PraiseToast({ message, isVisible, icon = '⭐' }) {
      if (!isVisible) return null;
      return (
        <div className="fixed inset-0 pointer-events-none z-40 flex items-start justify-center pt-24 sm:pt-28 p-4">
          <div className="relative animate-pop-in bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 border-3 border-white rounded-full px-5 py-3 sm:px-8 sm:py-4 shadow-xl flex flex-row items-center gap-3 sm:gap-4 max-w-sm sm:max-w-md">
            <div className="w-12 h-12 sm:w-14 sm:h-14 bg-white rounded-full flex items-center justify-center text-2xl sm:text-3xl shadow-md border-2 border-amber-300 flex-shrink-0 animate-bounce">
              {icon}
            </div>
            <div className="flex flex-col items-start text-left">
              <h2 className="text-lg sm:text-xl font-black text-amber-950 font-jua tracking-tight leading-tight">
                {message || '참 잘했어요!'}
              </h2>
              <div className="mt-0.5 bg-white/90 px-2 py-0.5 rounded-full border border-amber-400 font-jua text-emerald-800 text-[10px] sm:text-xs font-bold shadow-xs">
                🌱 지구를 지키는 점수 +1점!
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. 20점 달성 축하 팝업 모달
    // =========================================================================
    function GoalModal({ isOpen, classNameTitle, completedTreesCount, onStartNewTree }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 animate-pop-in">
          <div className="w-full max-w-xl max-h-[92dvh] overflow-y-auto bg-gradient-to-b from-amber-50 via-white to-emerald-50 rounded-3xl sm:rounded-[3rem] p-5 sm:p-8 shadow-2xl border-4 sm:border-6 border-amber-300 text-center relative">
            <div className="relative z-10 flex items-center justify-center gap-2 mb-2 sm:mb-3">
              <span className="text-3xl sm:text-4xl animate-bounce">👑</span>
              <div className="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-2xl sm:rounded-3xl flex items-center justify-center text-4xl sm:text-5xl shadow-xl border-4 border-white animate-pulse">
                🏆
              </div>
              <span className="text-3xl sm:text-4xl animate-bounce" style={{ animationDelay: '0.3s' }}>🎉</span>
            </div>

            <div className="relative z-10 mb-3 sm:mb-4">
              <span className="inline-block bg-amber-400 text-amber-950 px-4 py-1 rounded-full font-black text-sm sm:text-lg font-jua shadow-sm mb-1.5 animate-bounce-gentle">
                🌟 20점 만점 달성! 🌟
              </span>
              <h2 className="text-2xl sm:text-4xl font-black text-emerald-900 font-jua tracking-tight leading-tight">
                우와! {classNameTitle}이<br />
                <span className="text-amber-600 underline decoration-wavy decoration-amber-400">지구를 구했어요!</span> 🌍✨
              </h2>
              <p className="text-xs sm:text-base text-emerald-700 font-gowun font-bold mt-1.5">
                모두의 소중한 실천이 모여 아름다운 열매 나무를 완성했어요!
              </p>
            </div>

            <div className="relative z-10 bg-white/90 border-2 border-emerald-200 rounded-2xl p-3 sm:p-4 shadow-md mb-4 sm:mb-6 max-w-sm mx-auto">
              <div className="flex items-center justify-center gap-2 text-emerald-800 font-jua text-base sm:text-lg">
                <IconTrees size={24} className="text-emerald-600 animate-bounce" />
                <span>우리 반이 가꾼 숲:</span>
                <span className="text-xl sm:text-2xl font-black text-amber-600">총 {completedTreesCount + 1}그루!</span>
              </div>
            </div>

            <div className="relative z-10 flex justify-center">
              <button
                onClick={() => { sound.playResetSound(); onStartNewTree(); }}
                className="kiosk-btn px-6 sm:px-10 py-3 sm:py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-green-500 hover:from-emerald-600 hover:to-green-600 text-white font-jua text-lg sm:text-2xl rounded-full shadow-xl border-3 border-white transition active:scale-95 flex items-center gap-2 animate-shimmer"
              >
                <IconReset size={24} className="animate-spin" style={{ animationDuration: '6s' }} />
                <span>새로운 나무 심기 🌱</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 🌟 메인 애플리케이션 (태블릿PC & 모바일 & 데스크톱 풀 반응형)
    // =========================================================================
    function App() {
      // 로컬 스토리지 상태 복원
      const [score, setScore] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            return typeof parsed.score === 'number' ? parsed.score : 0;
          } catch { return 0; }
        }
        return 0;
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            return Array.isArray(parsed.history) ? parsed.history : [];
          } catch { return []; }
        }
        return [];
      });

      const [classNameTitle, setClassNameTitle] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            return parsed.classNameTitle || '지구를 지키는 1학년 1반';
          } catch { return '지구를 지키는 1학년 1반'; }
        }
        return '지구를 지키는 1학년 1반';
      });

      const [completedTreesCount, setCompletedTreesCount] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            return typeof parsed.completedTreesCount === 'number' ? parsed.completedTreesCount : 0;
          } catch { return 0; }
        }
        return 0;
      });

      const [isMuted, setIsMuted] = useState(false);
      const [isCustomOpen, setIsCustomOpen] = useState(false);
      const [isGoalOpen, setIsGoalOpen] = useState(false);
      const [toast, setToast] = useState({ isVisible: false, message: '', icon: '⭐' });
      const [mobileTab, setMobileTab] = useState('tree'); // 'tree' | 'history'

      const canvasRef = useRef(null);
      const particleEngineRef = useRef(null);
      const toastTimerRef = useRef(null);

      // 캔버스 파티클 초기화
      useEffect(() => {
        if (canvasRef.current) {
          particleEngineRef.current = new ParticleEngine(canvasRef.current);
        }
        return () => {
          if (particleEngineRef.current) particleEngineRef.current.destroy();
        };
      }, []);

      // 로컬 스토리지 자동 동기화
      useEffect(() => {
        const data = { score, history, classNameTitle, completedTreesCount };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }, [score, history, classNameTitle, completedTreesCount]);

      const toggleMute = () => {
        const next = !isMuted;
        setIsMuted(next);
        sound.setMuted(next);
      };

      // 단계 계산 (1: 0~5, 2: 6~10, 3: 11~19, 4: 20)
      const stage = useMemo(() => {
        if (score <= 5) return 1;
        if (score <= 10) return 2;
        if (score <= 19) return 3;
        return 4;
      }, [score]);

      const triggerPraise = (msg, icon = '⭐', clickX, clickY) => {
        sound.playPraiseSound();
        if (particleEngineRef.current) {
          const x = clickX || window.innerWidth / 2;
          const y = clickY || window.innerHeight / 2;
          particleEngineRef.current.burstStars(x, y, 28);
        }
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ isVisible: true, message: msg, icon });
        toastTimerRef.current = setTimeout(() => {
          setToast((prev) => ({ ...prev, isVisible: false }));
        }, 2200);
      };

      const handleAddAction = (actionItem, e) => {
        if (score >= 20) return;
        const newScore = score + 1;
        setScore(newScore);

        const now = new Date();
        const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        const newEntry = {
          id: Date.now() + Math.random().toString(),
          title: actionItem.title,
          icon: actionItem.icon,
          isCustom: false,
          time: timeStr,
          timestamp: Date.now()
        };
        setHistory((prev) => [newEntry, ...prev]);

        const rect = e?.currentTarget?.getBoundingClientRect();
        const clickX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
        const clickY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;

        triggerPraise('참 잘했어요!', actionItem.icon, clickX, clickY);

        if (newScore === 20) {
          setTimeout(() => {
            sound.playCelebrationFanfare();
            if (particleEngineRef.current) particleEngineRef.current.burstCelebration(6000);
            setIsGoalOpen(true);
          }, 1000);
        }
      };

      const handleCustomSubmit = (customText) => {
        if (score >= 20) {
          setIsCustomOpen(false);
          return;
        }
        const newScore = score + 1;
        setScore(newScore);

        const now = new Date();
        const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        const newEntry = {
          id: Date.now() + Math.random().toString(),
          title: customText,
          icon: '✨',
          isCustom: true,
          time: timeStr,
          timestamp: Date.now()
        };
        setHistory((prev) => [newEntry, ...prev]);
        setIsCustomOpen(false);

        triggerPraise(`"${customText}" 실천! 참 잘했어요!`, '✨');

        if (newScore === 20) {
          setTimeout(() => {
            sound.playCelebrationFanfare();
            if (particleEngineRef.current) particleEngineRef.current.burstCelebration(6000);
            setIsGoalOpen(true);
          }, 1200);
        }
      };

      return (
        <div className="min-h-screen lg:h-screen w-full flex flex-col bg-gradient-to-b from-sky-100 via-emerald-50 to-emerald-100 font-sans overflow-x-hidden relative">
          {/* 전체화면 이펙트 캔버스 */}
          <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-30 w-full h-full" />

          {/* 상단 헤더 */}
          <Header
            classNameTitle={classNameTitle}
            onUpdateTitle={setClassNameTitle}
            completedTreesCount={completedTreesCount}
            isMuted={isMuted}
            onToggleMute={toggleMute}
            onResetAll={() => {
              setScore(0);
              setHistory([]);
              setIsGoalOpen(false);
            }}
            activeTab={mobileTab}
            onSelectTab={setMobileTab}
            historyCount={history.length}
          />

          {/* 메인 작업 영역 */}
          <main className="flex-1 flex flex-col p-2 sm:p-3 gap-2 overflow-y-auto lg:overflow-hidden min-h-0">
            {/* 점수 현황 바 */}
            <ScoreBar score={score} maxScore={20} stage={stage} />

            {/* 대형 화면(lg 이상): 2단 분할 레이아웃 / 모바일&태블릿: 탭 or 스택 */}
            <div className="flex-1 flex flex-col lg:flex-row gap-2 min-h-0">
              {/* 좌측 패널: 나무 일러스트 & 실천 버튼들 */}
              <div className={`flex-1 flex-col gap-2 min-h-0 ${mobileTab === 'history' ? 'hidden lg:flex' : 'flex'}`}>
                {/* 나무 일러스트 박스 */}
                <div className="flex-1 bg-gradient-to-b from-sky-50/90 via-emerald-50/90 to-emerald-100/90 rounded-2xl sm:rounded-3xl border-2 sm:border-4 border-emerald-300 shadow-lg relative overflow-hidden flex items-center justify-center min-h-[300px] sm:min-h-[350px] lg:min-h-[400px]">
                  <TreeIllustration stage={stage} score={score} />
                </div>

                {/* 9개 실천 버튼 박스 */}
                <ActionButtonsGrid
                  onActionClick={handleAddAction}
                  onCustomClick={() => setIsCustomOpen(true)}
                  isMaxScore={score >= 20}
                />
              </div>

              {/* 우측 패널: 우리 반 실천 기록장 */}
              <div className={`w-full lg:w-72 xl:w-80 flex-shrink-0 ${mobileTab === 'tree' ? 'hidden lg:block' : 'block h-[420px] lg:h-full'}`}>
                <HistoryPanel history={history} />
              </div>
            </div>
          </main>

          {/* 오버레이 모달 & 팝업 */}
          <PraiseToast isVisible={toast.isVisible} message={toast.message} icon={toast.icon} />
          <CustomModal isOpen={isCustomOpen} onClose={() => setIsCustomOpen(false)} onSubmit={handleCustomSubmit} />
          <GoalModal
            isOpen={isGoalOpen}
            classNameTitle={classNameTitle}
            completedTreesCount={completedTreesCount}
            onStartNewTree={() => {
              setCompletedTreesCount((c) => c + 1);
              setScore(0);
              setHistory([]);
              setIsGoalOpen(false);
            }}
          />
        </div>
      );
    }

    // 마운트 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>
</html>
